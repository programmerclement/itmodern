<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Modern computers and electronics store in Kigali/Rwanda , Best choice Best Quality" />
    <title>IT Modern Ltd</title>
    <script>
      // Applies the dark class before first paint to avoid a flash of the
      // wrong theme. Kept in sync with ThemeContext.jsx (same storage key,
      // same "never dark on /admin" rule).
      (function () {
        try {
          var theme = localStorage.getItem('itmodern_theme') || 'system';
          var isAdminRoute = window.location.pathname.indexOf('/admin') === 0;
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var shouldBeDark = !isAdminRoute && (theme === 'dark' || (theme === 'system' && prefersDark));
          if (shouldBeDark) document.documentElement.classList.add('dark');
        } catch (error) {
          // localStorage unavailable — fall back to light mode
        }
      })();
    </script>
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        z-index: 9999;
      }
      html.dark #app-splash {
        background: #0f172a;
      }
      #app-splash img {
        width: 56px;
        height: 56px;
        animation: app-splash-spin 1.6s linear infinite;
      }
      @keyframes app-splash-spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-splash">
        <img src="/logo.png" alt="" />
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
